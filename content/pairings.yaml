- ingredients: [doubanjiang, black-vinegar]
  cuisines: [sichuan]
  reasons:
    - category: contrast
      note: Black vinegar's soft sourness balances the salty chile bean paste in fish-fragrant sauce.
      detail: "Fish-fragrant sauce is a classic Sichuan balance of salty, hot, sweet and sour; the vinegar goes in last, so it stays sharp."
  citations:
    - title: Fish-fragrant aubergines, by Fuchsia Dunlop, The Caterer
      url: https://www.thecaterer.com/news/fish-fragrant-aubergines-by-fuschia-dunlop

- ingredients: [black-vinegar, eggplant]
  cuisines: [sichuan]
  reasons:
    - category: contrast
      note: A splash of black vinegar at the end sharpens rich, oil-soft eggplant.
      detail: "Stir it in briefly and take the pan off the heat; cooked longer, the vinegar's edge fades."
  citations:
