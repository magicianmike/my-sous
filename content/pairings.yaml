- ingredients: [scallion, chicken-thigh]
  cuisines: [cantonese]
  reasons:
    - category: tradition
      note: Scallions go into the poaching water for Cantonese poached chicken, and into the ginger-scallion sauce served with it.
      detail: "Use the thinly sliced green tops raw over the finished chicken; the white parts can cook alongside it for a gentler onion flavour."
  citations:
