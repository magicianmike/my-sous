- ingredients: [ginger, chicken-thigh]
  cuisines: [cantonese, punjabi, japanese]
  reasons:
    - category: tradition
      note: Ginger seasons chicken in Cantonese poached chicken, Punjabi tandoori marinades and Japanese karaage.
      detail: "Sliced ginger can simmer with the chicken and be lifted out; grated ginger in a marinade gives a sharper, fresher heat."
  citations:
