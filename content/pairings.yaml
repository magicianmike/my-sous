# Every Pairing is stored once, in either order. The Kitchen shows it from both Ingredients.
# Reason categories: contrast, aromatic bridge, texture, tradition. A reason can add a longer `detail`.
# Every Pairing cites at least one source (`citations`, each a `title` and a `url`), and can list the
# `cuisines` (ids from cuisines.yaml) it's attested in. Research notes are in docs/research/.

- ingredients: [tomato, basil]
  cuisines: [southern-italian]
  reasons:
    - category: tradition
      note: Basil's sweet, peppery aroma often finishes ripe tomatoes in Southern Italian cooking.
      detail: "Many Neapolitan cooks put half the basil into the sauce and tear the rest over by hand at the end, so its fresh aroma comes through."
  citations:
    - title: Spaghetti al pomodoro fresco e basilico, Portanapoli
      url: https://www.portanapoli.com/Ita/Cucina/spaghetti_pomodoro_fresco.html
    - title: Pasta alla Norma, la ricetta originale catanese, Rossella Neri, Dissapore
      url: https://www.dissapore.com/ricette/pasta-alla-norma/

- ingredients: [tomato, garlic]
  cuisines: [southern-italian, punjabi]
  reasons:
    - category: tradition
      note: Garlic softened in oil is a common base for a quick tomato sauce, and garlic cooks with tomato in many Punjabi curries.
      detail: "Cook the garlic gently in oil until it's pale gold, then add the tomatoes; garlic browned at high heat turns bitter, and that bitterness can run through the whole sauce."
  citations:
    - title: Spaghetti al pomodoro fresco e basilico, Portanapoli
      url: https://www.portanapoli.com/Ita/Cucina/spaghetti_pomodoro_fresco.html
    - title: How to Cook with Garlic, Cook's Illustrated
      url: https://www.americastestkitchen.com/articles/2007-our-essential-guide-to-garlic
    - title: Mutton Karahi (Goat/Lamb Karahi), Izzah Cheema, Tea for Turmeric
      url: https://www.teaforturmeric.com/mutton-karahi-goat-lamb-karahi/
    - title: Dhaba Style Baingan Ka Bharta, Kunal Kapur
      url: https://www.chefkunalkapur.com/recipe/baingan-bharta/

- ingredients: [basil, garlic]
  cuisines: [ligurian]
  reasons:
    - category: tradition
      note: Pounded together with oil, they form the base of Ligurian pesto.
      detail: "Raw garlic is sharp, so a little goes a long way: the pesto consortium's recipe uses about one clove for every thirty basil leaves, pounded in a marble mortar."
  citations:
    - title: "Pesto genovese: ricetta ufficiale, Consorzio del Pesto Genovese, MangiareinLiguria"
      url: https://www.mangiareinliguria.it/pesto-genovese/ricetta-pesto-genovese

- ingredients: [garlic, lemon]
  cuisines: [levantine]
  reasons:
    - category: tradition
      note: Garlic and lemon juice season the tahini sauces served with Levantine kafta, fried cauliflower and mutabbal.
  citations:
    - title: Palestinian Kafta with Tahini Sauce, Wafa Shami, Palestine in a Dish
      url: https://palestineinadish.com/recipes/kiftah-bi-tahini-sauce/
    - title: Fried Cauliflower with Tahini Sauce, Hadia Zebib, Hadia's Lebanese Cuisine
      url: https://hadiaslebanesecuisine.com/newsite/recipe-items/fried-cauliflower-tahini-sauce/
    - title: Mutabbal Beitinjan (Eggplant Mutabal), Dima Sharif
      url: https://www.dimasharif.com/recipes/eggplant-mutabal/

- ingredients: [lemon, chicken-thigh]
  cuisines: [punjabi, japanese]
  reasons:
    - category: tradition
      note: Lemon juice goes into the tandoori marinade for chicken thighs, and lemon wedges are served with Japanese karaage.
      detail: "In a marinade, lemon is mixed with thick yogurt and spices; at the table, a squeeze over fried chicken freshens it."
  citations:
    - title: Tandoori Chicken, Izzah Cheema, Tea for Turmeric
      url: https://www.teaforturmeric.com/tandoori-chicken/
    - title: Karaage, Just One Cookbook
      url: https://www.justonecookbook.com/karaage/

- ingredients: [garlic, chicken-thigh]
  cuisines: [punjabi, japanese]
  reasons:
    - category: tradition
      note: Garlic seasons chicken thigh in Punjabi tandoori marinades and Japanese karaage, and whole cloves roast soft beside it.
      detail: "Unpeeled cloves can roast with the chicken for the whole time and turn soft and sweet; chopped garlic burns faster, so add it in the last few minutes."
  citations:
    - title: Chicken Vesuvio, America's Test Kitchen
      url: https://www.americastestkitchen.com/recipes/11170-chicken-vesuvio
    - title: Tandoori Chicken, Izzah Cheema, Tea for Turmeric
