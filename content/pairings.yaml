      url: https://thewoksoflife.com/cantonese-poached-chicken-w-ginger-scallion-oil-bai-qie-ji/

- ingredients: [ginger, garlic]
  cuisines: [cantonese, punjabi]
  reasons:
    - category: aromatic bridge
      note: Often cooked together at the start of a stir-fry or a curry to season the oil.
      detail: "Add them to the oil over moderate heat and stir for a few seconds until fragrant; they burn quickly, and burnt, they turn bitter."
  citations:
    - title: Choy Sum with Garlic, Made With Lau
