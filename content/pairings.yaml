# Sichuan, Japanese home cooking and Cantonese (#17; research in docs/research/0017-sichuan-japanese-cantonese.md)

- ingredients: [sichuan-pepper, dried-chile]
  cuisines: [sichuan]
  reasons:
    - category: tradition
      note: Together they make mala, the numbing-and-hot taste of much Sichuan cooking.
      detail: "The pepper's tingle softens the chile's burn and makes it last, so the heat reads as layered rather than harsh. Many cooks fry both in oil at the start, taking care not to scorch them."
  citations:
    - title: Sichuan Peppercorns, The Woks of Life
      url: https://thewoksoflife.com/sichuan-peppercorns/
    - title: "'The Food of Sichuan': how a British writer brought the flavours of provincial China to the world, The National"
      url: https://www.thenationalnews.com/lifestyle/food/the-food-of-sichuan-how-a-british-writer-brought-the-flavours-of-provincial-china-to-the-world-1.1028035
    - title: "Gong Bao Chicken with Peanuts (Fuchsia Dunlop, Every Grain of Rice), The Splendid Table"
      url: https://www.splendidtable.org/story/2015/02/13/gong-bao-chicken-with-peanuts

- ingredients: [sichuan-pepper, chicken-thigh]
  cuisines: [sichuan]
  reasons:
    - category: tradition
      note: In Chongqing chicken, crisp-fried pieces of chicken are tossed with whole Sichuan pepper and a heap of dried chiles.
      detail: "Thigh stays juicy through the double cooking. The pepper goes into the oil with the chiles near the end, only long enough to turn fragrant."
  citations:
    - title: Chongqing Chicken (La Zi Ji), The Woks of Life
      url: https://thewoksoflife.com/chongqing-chicken/

- ingredients: [sichuan-pepper, doubanjiang]
  cuisines: [sichuan]
  reasons:
    - category: tradition
      note: Mapo tofu is built on chile bean paste and finished with ground Sichuan pepper.
      detail: "The paste goes in early, fried until the oil turns red; the pepper goes on at the end, freshly ground, so its aroma is the first thing you notice."
  citations:
    - title: Fuchsia Dunlop's mapo tofu, SBS Food
      url: https://www.sbs.com.au/food/recipe/fuchsia-dunlops-mapo-tofu/fwvcw6ya9

- ingredients: [sichuan-pepper, black-vinegar]
  cuisines: [sichuan]
  reasons:
    - category: tradition
      note: Sichuan cold dressings often combine black vinegar's malty sourness with ground roasted Sichuan pepper.
      detail: "There's no single recipe for these dressings, and every cook balances them differently; start with a little pepper and add more to taste."
  citations:
    - title: Fuchsia Dunlop's Cold-dressed Chicken, Sous Chef
      url: https://www.souschef.co.uk/blogs/the-bureau-of-taste/cold-dressed-chicken
    - title: "Fuchsia Dunlop: Sichuan food is all about balance, not battering your palate with heat, The Irish News"
      url: https://www.irishnews.com/lifestyle/2019/11/09/news/fuchsia-dunlop-sichuan-food-is-all-about-balance-not-battering-your-palate-with-heat-1758271/

- ingredients: [doubanjiang, pork]
  cuisines: [sichuan]
  reasons:
    - category: tradition
      note: In twice-cooked pork, boiled, sliced pork is stir-fried with chile bean paste until its fat turns the paste red and glossy.
      detail: "Fry the pork first so some fat renders, then push it aside and fry the paste in that fat before tossing them together."
  citations:
    - title: Twice-Cooked Pork (Fuchsia Dunlop), NPR via VPM
      url: https://www.vpm.org/npr-news/2008-05-02/twice-cooked-pork

- ingredients: [doubanjiang, eggplant]
  cuisines: [sichuan]
  reasons:
    - category: tradition
      note: In fish-fragrant eggplant, the soft fried eggplant soaks up a sauce of chile bean paste fried in oil.
      detail: "Eggplant drinks oil and sauce like a sponge, so it carries the paste's salty heat right through. Fry the eggplant until soft before it meets the sauce."
  citations:
    - title: Fish-fragrant aubergines, by Fuchsia Dunlop, The Caterer
      url: https://www.thecaterer.com/news/fish-fragrant-aubergines-by-fuschia-dunlop

- ingredients: [doubanjiang, garlic]
  cuisines: [sichuan]
  reasons:
    - category: aromatic bridge
      note: Garlic usually goes into the oil straight after the chile bean paste, deepening the base of the sauce.
      detail: "Add the garlic once the oil has turned red, and keep the heat moderate; both burn if the pan is too hot."
  citations:
    - title: Fish-fragrant aubergines, by Fuchsia Dunlop, The Caterer
      url: https://www.thecaterer.com/news/fish-fragrant-aubergines-by-fuschia-dunlop
    - title: Fuchsia Dunlop's mapo tofu, SBS Food
      url: https://www.sbs.com.au/food/recipe/fuchsia-dunlops-mapo-tofu/fwvcw6ya9

- ingredients: [doubanjiang, ginger]
  cuisines: [sichuan]
  reasons:
    - category: aromatic bridge
      note: Ginger fried in the reddened bean-paste oil adds a warm, fresh edge to its salty depth.
      detail: "Use it finely chopped, alongside garlic, and fry only until fragrant before the liquid goes in."
  citations:
    - title: Fish-fragrant aubergines, by Fuchsia Dunlop, The Caterer
      url: https://www.thecaterer.com/news/fish-fragrant-aubergines-by-fuschia-dunlop
    - title: Fuchsia Dunlop's mapo tofu, SBS Food
      url: https://www.sbs.com.au/food/recipe/fuchsia-dunlops-mapo-tofu/fwvcw6ya9

- ingredients: [doubanjiang, scallion]
  cuisines: [sichuan]
  reasons:
    - category: tradition
      note: Scallions simmer in the chile bean sauce of mapo tofu, and their green tops finish fish-fragrant dishes.
      detail: "Their mild, sweet onion flavour softens the paste's saltiness; added at the end, the greens stay bright and fresh."
  citations:
