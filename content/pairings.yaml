    - title: Karaage, Just One Cookbook
      url: https://www.justonecookbook.com/karaage/

- ingredients: [lime, cilantro]
  reasons:
    - category: tradition
      note: Usually added together at the end, as in many Mexican salsas and ceviches, to brighten a dish.
      detail: "Both are usually added raw, off the heat. Many Mexican salsas take a squeeze of lime only sometimes, so taste first."
  citations:
    - title: Salsa mexicana, Diccionario enciclopédico de la Gastronomía Mexicana, Larousse Cocina
      url: https://laroussecocina.mx/palabra/salsa-mexicana/
    - title: Cilantro, Diccionario enciclopédico de la Gastronomía Mexicana, Larousse Cocina
      url: https://laroussecocina.mx/palabra/cilantro/

- ingredients: [lime, chicken-thigh]
  cuisines: [punjabi]
  reasons:
    - category: contrast
      note: Lime's acid sharpens rich, browned chicken thigh.
      detail: "Lime wedges are often served with tandoori chicken and with braised Mexican chicken, to squeeze on at the table."
  citations:
    - title: Tandoori Chicken, Izzah Cheema, Tea for Turmeric
      url: https://www.teaforturmeric.com/tandoori-chicken/
    - title: Braised Oregano Chicken, Rick Bayless
      url: https://www.rickbayless.com/recipe/oregano-chicken/

- ingredients: [cilantro, chicken-thigh]
  cuisines: [oaxacan, punjabi]
  reasons:
    - category: tradition
      note: Cilantro goes into Oaxacan mole verde with chicken, and it's scattered over tandoori chicken.
      detail: "As a garnish, scatter the leaves and tender stems over the chicken after cooking."
  citations:
    - title: Mole verde, Diccionario enciclopédico de la Gastronomía Mexicana, Larousse Cocina
      url: https://laroussecocina.mx/palabra/mole-verde/
    - title: Tandoori Chicken, Izzah Cheema, Tea for Turmeric
      url: https://www.teaforturmeric.com/tandoori-chicken/

- ingredients: [ginger, scallion]
  cuisines: [cantonese]
  reasons:
    - category: tradition
      note: Minced together with oil and salt, they make the ginger-scallion sauce served with poached chicken in Cantonese cooking.
      detail: "Many cooks mix the raw ginger and scallion with oil, which is the older way; others pour sizzling oil over them, which softens their raw edge."
  citations:
